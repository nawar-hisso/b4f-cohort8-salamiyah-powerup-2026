<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- The top bar of the application. -->
    <header class="header">
        <h1>TaskFlow</h1>
        <p>All your tasks in one place.</p>
    </header>

    <main class="container">

        <!-- The cards that show our numbers. -->
        <section class="stats">

            <div class="stat-card">
                <p class="stat-label">Total Tasks</p>
                <p class="stat-value">6</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Completed</p>
                <p class="stat-value">2</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Pending</p>
                <p class="stat-value">4</p>
            </div>

        </section>

        <!-- The buttons that will choose which tasks we see. -->
        <section class="filters">
            <button class="filter-button active">All</button>
            <button class="filter-button">Completed</button>
            <button class="filter-button">Pending</button>
        </section>

        <!-- The list of tasks. -->
        <ul class="task-list">

            <li class="task-item">
                <span class="task-title">Design the TaskFlow page</span>
                <span class="task-status completed">Completed</span>
            </li>

            <li class="task-item">
                <span class="task-title">Write the HTML structure</span>
                <span class="task-status completed">Completed</span>
            </li>

            <li class="task-item">
                <span class="task-title">Style the statistic cards</span>
                <span class="task-status pending">Pending</span>
            </li>

            <li class="task-item">
                <span class="task-title">Build the task list</span>
                <span class="task-status pending">Pending</span>
            </li>

            <li class="task-item">
                <span class="task-title">Practice JavaScript</span>
                <span class="task-status pending">Pending</span>
            </li>

            <li class="task-item">
                <span class="task-title">Learn how an API works</span>
                <span class="task-status pending">Pending</span>
            </li>

        </ul>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
